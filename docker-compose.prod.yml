version: '3.8'

services:
  # === DATABASE SERVICES ===

  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: ai_zero_day_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme123}
      MONGO_INITDB_DATABASE: zero_day_detector
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - ai_zero_day_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Redis for caching and session management
  redis:
    image: redis:7.0-alpine
    container_name: ai_zero_day_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai_zero_day_network
    command: redis-server --appendonly yes

  # === MESSAGE BROKER SERVICES ===

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: ai_zero_day_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - ai_zero_day_network

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: ai_zero_day_kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - ai_zero_day_network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3

  # === CORE AI SERVICES ===

  # AI Zero-Day Detection API
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ai_zero_day_api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Database
      - MONGO_CONNECTION_STRING=mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-changeme123}@mongodb:27017/zero_day_detector
      - DATABASE_NAME=zero_day_detector

      # Message Broker
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092

      # API Configuration
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_RELOAD=false

      # ML Model Configuration
      - LSTM_MODEL_PATH=/app/trained_models/lstm
      - GNN_MODEL_PATH=/app/trained_models/gnn
      - ENSEMBLE_MODEL_PATH=/app/trained_models/ensemble

      # Logging
      - LOG_LEVEL=INFO
      - LOG_FILE=/app/logs/api.log

      # Security
      - SECRET_KEY=${SECRET_KEY:-your-production-secret-key}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-jwt-production-key}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_HOURS=24

      # Incident Response
      - AUTO_RESPONSE_ENABLED=${AUTO_RESPONSE_ENABLED:-false}
      - HIGH_SEVERITY_AUTO_ISOLATE=${HIGH_SEVERITY_AUTO_ISOLATE:-false}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    volumes:
      - ./trained_models:/app/trained_models:ro
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - ai_zero_day_network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # === DATA COLLECTION SERVICES ===

  # Live Sysmon Collector
  sysmon_collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
      target: sysmon-collector
    container_name: ai_zero_day_sysmon_collector
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC_SYSMON=sysmon_events
      - COLLECTION_INTERVAL=5
      - LOG_LEVEL=INFO
    volumes:
      # Mount Windows Event Logs (Windows host only)
      - type: bind
        source: //./SysmonLog
        target: /var/log/sysmon
        read_only: true
    networks:
      - ai_zero_day_network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Live Network Collector
  network_collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
      target: network-collector
    container_name: ai_zero_day_network_collector
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC_NETWORK=network_flows
      - TSHARK_INTERFACE=eth0
      - COLLECTION_INTERVAL=10
      - LOG_LEVEL=INFO
    volumes:
      - ./data/captures:/app/data/captures
    networks:
      - ai_zero_day_network
    # Requires privileged access for packet capture
    privileged: true
    cap_add:
      - NET_RAW
      - NET_ADMIN
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # === STREAMING ANALYTICS SERVICES ===

  # Streaming Event Processor
  streaming_processor:
    build:
      context: .
      dockerfile: Dockerfile.streaming
      target: streaming-processor
    container_name: ai_zero_day_streaming_processor
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC_SYSMON=sysmon_events
      - KAFKA_TOPIC_NETWORK=network_flows
      - API_BASE_URL=http://api:8000
      - LSTM_MODEL_PATH=/app/trained_models/lstm
      - BATCH_SIZE=10
      - BATCH_TIMEOUT=5.0
      - LOG_LEVEL=INFO
    volumes:
      - ./trained_models:/app/trained_models:ro
      - ./logs:/app/logs
    networks:
      - ai_zero_day_network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # === MONITORING AND LOGGING ===

  # Prometheus Metrics Collector
  prometheus:
    image: prom/prometheus:latest
    container_name: ai_zero_day_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ai_zero_day_network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: ai_zero_day_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - ai_zero_day_network

  # ELK Stack for Log Aggregation (Optional)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.5.0
    container_name: ai_zero_day_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ai_zero_day_network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  logstash:
    image: docker.elastic.co/logstash/logstash:8.5.0
    container_name: ai_zero_day_logstash
    restart: unless-stopped
    depends_on:
      - elasticsearch
      - kafka
    ports:
      - "5044:5044"
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logs:/app/logs:ro
    environment:
      - KAFKA_SERVERS=kafka:29092
    networks:
      - ai_zero_day_network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.5.0
    container_name: ai_zero_day_kibana
    restart: unless-stopped
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - ai_zero_day_network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  kafka_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  ai_zero_day_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
